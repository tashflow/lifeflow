name: LifeFlow Firestore Security Rules CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-security-tests:
    name: Firestore Emulator Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java Runtime for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.36.0

      - name: Run Firestore Security Rules Tests in Emulator
        run: |
          set -o pipefail
          firebase emulators:exec \
            --only firestore \
            --project lifeflow-stage-03c1-test \
            "bun run test:rules -- --ci --verbose --json --outputFile=firestore-test-results.json" 2>&1 | tee firestore-test-output.log

      - name: Upload Security Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-security-test-results
          path: |
            firestore-test-results.json
            firestore-test-output.log
          if-no-files-found: ignore
          retention-days: 14
